<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genrator · Renderer preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; }
    .views { position: fixed; inset: 0 0 44px 0; display: grid; grid-template-columns: 1fr; }
    body.split .views { grid-template-columns: 1fr 1fr; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #raw { display: none; }
    body.split #raw { display: block; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 18px; align-items: center;
      padding: 0 14px; background: #1c1c1c; border-top: 1px solid #333; }
    .bar label { display: flex; gap: 6px; align-items: center; }
    #status { margin-left: auto; color: #999; }
  </style>
</head>
<body>
  <div class="views">
    <video id="raw" autoplay playsinline muted></video>
    <video id="styled" autoplay playsinline muted></video>
  </div>
  <div class="bar">
    <label>World look <select id="world"></select></label>
    <label><input type="checkbox" id="debug"> Outlines</label>
    <label><input type="checkbox" id="split"> Side by side with camera</label>
    <span id="fps"></span>
    <span id="status">Starting…</span>
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
